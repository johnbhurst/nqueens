<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -20 830 830" width="830" height="830">
  <!-- Hand-written SVG by Claude (Opus 5.5, Anthropic), 2026-10-31, replacing the OmniGraffle original. -->
  <title>N-Queens: available squares in the next row</title>
  <!-- Board squares are 100x100. Square (row, col) has its top-left corner at (col*100, row*100). -->
  <defs>
    <!-- 2x2 squares of the checkerboard, repeated across the board -->
    <pattern id="squares" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="white"/>
      <rect x="100" y="0" width="100" height="100" fill="#ccc"/>
      <rect x="0" y="100" width="100" height="100" fill="#ccc"/>
      <path d="M0,0 H200 M0,100 H200 M0,200 H200 M0,0 V200 M100,0 V200 M200,0 V200"
            stroke="black" stroke-width="3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 4 3" refX="0" refY="1.5" markerWidth="6" markerHeight="4.5" orient="auto">
      <path d="M0,0 L4,1.5 L0,3 Z" fill="#666"/>
    </marker>
    <symbol id="queen" viewBox="0 0 100 100">
      <text x="50" y="84" font-size="88" text-anchor="middle"
            font-family="DejaVu Sans, Segoe UI Symbol, Apple Symbols, sans-serif">♛</text>
    </symbol>
  </defs>

  <!-- Page background, so the diagram also works in dark-themed viewers -->
  <rect x="-15" y="-20" width="830" height="830" fill="white"/>

  <!-- Board -->
  <rect x="0" y="0" width="800" height="800" fill="url(#squares)" stroke="black" stroke-width="8"/>

  <!-- Row 3: squares attacked by a queen (red) and available squares (green) -->
  <g fill="#ff2600" fill-opacity="0.2">
    <rect x="0"   y="300" width="100" height="100"/>
    <rect x="300" y="300" width="100" height="100"/>
    <rect x="500" y="300" width="100" height="100"/>
    <rect x="600" y="300" width="100" height="100"/>
    <rect x="700" y="300" width="100" height="100"/>
  </g>
  <g fill="#00fa00" fill-opacity="0.2" stroke="black" stroke-width="5">
    <rect x="100" y="300" width="100" height="100"/>
    <rect x="200" y="300" width="100" height="100"/>
    <rect x="400" y="300" width="100" height="100"/>
  </g>

  <!-- Columns and diagonals occupied by queens -->
  <g stroke="#666" stroke-width="4" stroke-dasharray="4 20" stroke-linecap="round" marker-end="url(#arrow)">
    <!-- columns 0, 5, 7 -->
    <line x1="50"  y1="-15" x2="50"  y2="770"/>
    <line x1="550" y1="-15" x2="550" y2="770"/>
    <line x1="750" y1="-15" x2="750" y2="770"/>
    <!-- diagonal 1 bits 0, 6, 9 -->
    <line x1="110" y1="-10" x2="21"  y2="79"/>
    <line x1="710" y1="-10" x2="21"  y2="679"/>
    <line x1="810" y1="190" x2="221" y2="779"/>
    <!-- diagonal 2 bits 2, 3, 7 -->
    <line x1="490" y1="-10" x2="779" y2="279"/>
    <line x1="390" y1="-10" x2="779" y2="379"/>
    <line x1="-10" y1="-10" x2="779" y2="779"/>
  </g>

  <!-- Queens -->
  <use href="#queen" x="0"   y="0"   width="100" height="100"/>
  <use href="#queen" x="500" y="100" width="100" height="100"/>
  <use href="#queen" x="700" y="200" width="100" height="100"/>
</svg>
