<svg xmlns="http://www.w3.org/2000/svg" viewBox="-95 -50 905 860" width="905" height="860">
  <!-- Hand-written SVG by Claude (Opus 5.5, Anthropic), 2026-10-31, replacing the OmniGraffle original. -->
  <title>N-Queens: diagonal 2 bits</title>
  <!-- Board squares are 100x100. Square (row, col) has its top-left corner at (col*100, row*100). -->
  <defs>
    <!-- 2x2 squares of the checkerboard, repeated across the board -->
    <pattern id="squares" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="white"/>
      <rect x="100" y="0" width="100" height="100" fill="#ccc"/>
      <rect x="0" y="100" width="100" height="100" fill="#ccc"/>
      <path d="M0,0 H200 M0,100 H200 M0,200 H200 M0,0 V200 M100,0 V200 M200,0 V200"
            stroke="black" stroke-width="3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 4 3" refX="0" refY="1.5" markerWidth="6" markerHeight="4.5" orient="auto">
      <path d="M0,0 L4,1.5 L0,3 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- Page background, so the diagram also works in dark-themed viewers -->
  <rect x="-95" y="-50" width="905" height="860" fill="white"/>

  <!-- Board -->
  <rect x="0" y="0" width="800" height="800" fill="url(#squares)" stroke="black" stroke-width="8"/>

  <!-- Diagonals running down-right: bit = 7 - col + row, so each line has x - y = 100 * (7 - bit) -->
  <g stroke="#666" stroke-width="4" stroke-dasharray="4 20" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="690" y1="-10" x2="779" y2="79"/>
    <line x1="590" y1="-10" x2="779" y2="179"/>
    <line x1="490" y1="-10" x2="779" y2="279"/>
    <line x1="390" y1="-10" x2="779" y2="379"/>
    <line x1="290" y1="-10" x2="779" y2="479"/>
    <line x1="190" y1="-10" x2="779" y2="579"/>
    <line x1="90"  y1="-10" x2="779" y2="679"/>
    <line x1="-10" y1="-10" x2="779" y2="779"/>
    <line x1="-10" y1="90"  x2="679" y2="779"/>
    <line x1="-10" y1="190" x2="579" y2="779"/>
    <line x1="-10" y1="290" x2="479" y2="779"/>
    <line x1="-10" y1="390" x2="379" y2="779"/>
    <line x1="-10" y1="490" x2="279" y2="779"/>
    <line x1="-10" y1="590" x2="179" y2="779"/>
    <line x1="-10" y1="690" x2="79"  y2="779"/>
  </g>
  <g font-family="Source Code Pro, DejaVu Sans Mono, Consolas, monospace" font-size="18">
    <g text-anchor="middle">
      <text x="690" y="-25">bit 0</text>
      <text x="590" y="-25">bit 1</text>
      <text x="490" y="-25">bit 2</text>
      <text x="390" y="-25">bit 3</text>
      <text x="290" y="-25">bit 4</text>
      <text x="190" y="-25">bit 5</text>
      <text x="90"  y="-25">bit 6</text>
      <text x="-10" y="-25">bit 7</text>
    </g>
    <g text-anchor="end">
      <text x="-22" y="96">bit 8</text>
      <text x="-22" y="196">bit 9</text>
      <text x="-22" y="296">bit 10</text>
      <text x="-22" y="396">bit 11</text>
      <text x="-22" y="496">bit 12</text>
      <text x="-22" y="596">bit 13</text>
      <text x="-22" y="696">bit 14</text>
    </g>
  </g>
</svg>
