<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 2820 820" width="2820" height="820">
  <!-- Hand-written SVG by Claude (Opus 5.5, Anthropic), 2026-10-31, replacing the OmniGraffle original. -->
  <title>N-Queens: next boards</title>
  <!-- Three boards, 1000 apart. Board squares are 100x100.
       Square (row, col) has its top-left corner at (col*100, row*100) within its board. -->
  <defs>
    <!-- 2x2 squares of the checkerboard, repeated across the board -->
    <pattern id="squares" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="white"/>
      <rect x="100" y="0" width="100" height="100" fill="#ccc"/>
      <rect x="0" y="100" width="100" height="100" fill="#ccc"/>
      <path d="M0,0 H200 M0,100 H200 M0,200 H200 M0,0 V200 M100,0 V200 M200,0 V200"
            stroke="black" stroke-width="3"/>
    </pattern>
    <rect id="board" x="0" y="0" width="800" height="800" fill="url(#squares)" stroke="black" stroke-width="8"/>
    <symbol id="queen" viewBox="0 0 100 100">
      <text x="50" y="84" font-size="88" text-anchor="middle"
            font-family="DejaVu Sans, Segoe UI Symbol, Apple Symbols, sans-serif">♛</text>
    </symbol>
  </defs>

  <!-- Page background, so the diagram also works in dark-themed viewers -->
  <rect x="-10" y="-10" width="2820" height="820" fill="white"/>

  <!-- Next board with a queen in row 3, col 1 -->
  <g>
    <use href="#board"/>
    <use href="#queen" x="0"   y="0"   width="100" height="100"/>
    <use href="#queen" x="500" y="100" width="100" height="100"/>
    <use href="#queen" x="700" y="200" width="100" height="100"/>
    <use href="#queen" x="100" y="300" width="100" height="100"/>
  </g>

  <!-- Next board with a queen in row 3, col 2 -->
  <g transform="translate(1000 0)">
    <use href="#board"/>
    <use href="#queen" x="0"   y="0"   width="100" height="100"/>
    <use href="#queen" x="500" y="100" width="100" height="100"/>
    <use href="#queen" x="700" y="200" width="100" height="100"/>
    <use href="#queen" x="200" y="300" width="100" height="100"/>
  </g>

  <!-- Next board with a queen in row 3, col 4 -->
  <g transform="translate(2000 0)">
    <use href="#board"/>
    <use href="#queen" x="0"   y="0"   width="100" height="100"/>
    <use href="#queen" x="500" y="100" width="100" height="100"/>
    <use href="#queen" x="700" y="200" width="100" height="100"/>
    <use href="#queen" x="400" y="300" width="100" height="100"/>
  </g>

  <!-- Plus signs between the boards -->
  <path d="M900,340 V460 M840,400 H960 M1900,340 V460 M1840,400 H1960" stroke="black" stroke-width="16"/>
</svg>
