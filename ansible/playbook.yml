---
# System-wide packages, installed as root.
- name: Install system packages
  hosts: all
  vars_files:
    - vars.yml

  become: yes
  tasks:

    - name: Install aptitude
      apt:
        name: aptitude
        state: present
        force_apt_get: yes
        update_cache: yes

    - name: Install language/locale support
      apt:
        name: language-pack-en
        state: present

    # Tagged always, so they are installed when running selected tags.
    - name: Install tools needed by later tasks
      apt:
        name:
          - curl
          - zip
          - unzip
          - python3-debian # for deb822_repository
        state: present
      tags: always

# Common Lisp: SBCL, and buildapp to build executables, from the Ubuntu
# archive.
- name: Install Common Lisp
  hosts: all
  vars_files:
    - vars.yml
  tags: commonlisp

  become: yes
  tasks:

    - name: Install SBCL and buildapp
      apt:
        name:
          - sbcl
          - buildapp
        state: present
        update_cache: yes

# Crystal, from the official repository on the openSUSE Build Service,
# as used by https://crystal-lang.org/install/on_ubuntu/.
# The Ubuntu archive also has Crystal, but an older version.
- name: Install Crystal
  hosts: all
  vars_files:
    - vars.yml
  tags: crystal

  become: yes
  vars:
    crystal_repo_url: "https://download.opensuse.org/repositories/devel:/languages:/crystal/xUbuntu_{{ ansible_facts.distribution_version }}/"
  tasks:

    - name: Define repo for Crystal
      deb822_repository:
        name: crystal
        types: deb
        uris: "{{ crystal_repo_url }}"
        suites: /
        signed_by: "{{ crystal_repo_url }}Release.key"
        state: present

    - name: Install Crystal
      apt:
        name: crystal
        state: present
        update_cache: yes

# Dart, from Google's repository, as used by
# https://dart.dev/get-dart#install-using-apt-get.
- name: Install Dart
  hosts: all
  vars_files:
    - vars.yml
  tags: dart

  become: yes
  tasks:

    - name: Define repo for Dart
      deb822_repository:
        name: dart
        types: deb
        uris: https://storage.googleapis.com/download.dartlang.org/linux/debian
        suites: stable
        components: main
        signed_by: https://dl-ssl.google.com/linux/linux_signing_key.pub
        state: present

    - name: Install Dart
      apt:
        name: dart
        state: present
        update_cache: yes

# Elixir, from the Ubuntu archive. The elixir package depends on the
# Erlang/OTP packages it needs.
- name: Install Elixir
  hosts: all
  vars_files:
    - vars.yml
  tags: elixir

  become: yes
  tasks:

    - name: Install Elixir
      apt:
        name: elixir
        state: present
        update_cache: yes

# Go, from the Ubuntu archive. golang-go installs Ubuntu's default Go
# version; golang-1.NN-go packages provide other versions.
- name: Install Go
  hosts: all
  vars_files:
    - vars.yml
  tags: golang

  become: yes
  tasks:

    - name: Install Go
      apt:
        name: golang-go
        state: present
        update_cache: yes

# Haskell GHC compiler, from the Ubuntu archive. The Haskell Platform
# package is gone, and the programs need only GHC's base libraries.
- name: Install Haskell
  hosts: all
  vars_files:
    - vars.yml
  tags: haskell

  become: yes
  tasks:

    - name: Install GHC
      apt:
        name: ghc
        state: present
        update_cache: yes

# Node.js for JavaScript, from the NodeSource repository, which provides
# current LTS versions. The Ubuntu archive has an older Node.js.
- name: Install Node.js
  hosts: all
  vars_files:
    - vars.yml
  tags: javascript

  become: yes
  tasks:

    - name: Define repo for Node.js
      deb822_repository:
        name: nodesource
        types: deb
        uris: "https://deb.nodesource.com/node_{{ nodejs_major_version }}.x"
        suites: nodistro
        components: main
        signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        state: present

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
        update_cache: yes

# Julia, from the official binary archive, unpacked in /opt.
# Julia is not in the Ubuntu archive.
- name: Install Julia
  hosts: all
  vars_files:
    - vars.yml
  tags: julia

  become: yes
  tasks:

    - name: Check if Julia is already unpacked
      stat:
        path: "{{ julia.root }}"
      register: julia_root

    - name: Download and unpack Julia
      when: not julia_root.stat.exists
      block:

        - name: Download Julia archive
          get_url:
            url: "{{ julia.base_url }}/{{ julia.archive }}"
            dest: "/tmp/{{ julia.archive }}"
            checksum: "sha256:{{ julia.sha256 }}"
            timeout: 60

        - name: Unpack Julia archive
          unarchive:
            remote_src: yes
            src: "/tmp/{{ julia.archive }}"
            dest: /opt/
            creates: "{{ julia.root }}"

        - name: Remove Julia archive
          file:
            path: "/tmp/{{ julia.archive }}"
            state: absent

    # A link in /usr/local/bin works for every shell, unlike /etc/profile.d,
    # which zsh does not read.
    - name: Link julia into /usr/local/bin
      file:
        src: "{{ julia.root }}/bin/julia"
        dest: /usr/local/bin/julia
        state: link
        force: yes

    - name: Remove old Julia PATH setting
      file:
        path: /etc/profile.d/julia-path.sh
        state: absent

# Nim, from the Ubuntu archive.
- name: Install Nim
  hosts: all
  vars_files:
    - vars.yml
  tags: nim

  become: yes
  tasks:

    - name: Install Nim
      apt:
        name: nim
        state: present
        update_cache: yes

# Ruby, from the Ubuntu archive. Ruby is in Ubuntu's main component, so
# it gets security updates for the life of the Ubuntu release.
- name: Install Ruby
  hosts: all
  vars_files:
    - vars.yml
  tags: ruby

  become: yes
  tasks:

    - name: Install Ruby
      apt:
        name: ruby
        state: present
        update_cache: yes

# Swift, from the Ubuntu archive. The swiftlang package depends on the
# packages swiftc needs to compile and link.
- name: Install Swift
  hosts: all
  vars_files:
    - vars.yml
  tags: swift

  become: yes
  tasks:

    - name: Install Swift
      apt:
        name: swiftlang
        state: present
        update_cache: yes

    - name: Remove old Swift PATH setting
      file:
        path: /etc/profile.d/swift-path.sh
        state: absent

# Zig, from the official binary archive, unpacked in /opt.
# The Ubuntu archive's Zig is too old for the program, and Zig changes
# incompatibly between releases, so the version is pinned in vars.yml.
- name: Install Zig
  hosts: all
  vars_files:
    - vars.yml
  tags: zig

  become: yes
  tasks:

    - name: Check if Zig is already unpacked
      stat:
        path: "{{ zig.root }}"
      register: zig_root

    - name: Download and unpack Zig
      when: not zig_root.stat.exists
      block:

        - name: Install xz-utils, to unpack the Zig archive
          apt:
            name: xz-utils
            state: present

        - name: Download Zig archive
          get_url:
            url: "{{ zig.base_url }}/{{ zig.archive }}"
            dest: "/tmp/{{ zig.archive }}"
            checksum: "sha256:{{ zig.sha256 }}"
            timeout: 60

        - name: Unpack Zig archive
          unarchive:
            remote_src: yes
            src: "/tmp/{{ zig.archive }}"
            dest: /opt/
            creates: "{{ zig.root }}"

        - name: Remove Zig archive
          file:
            path: "/tmp/{{ zig.archive }}"
            state: absent

    - name: Link zig into /usr/local/bin
      file:
        src: "{{ zig.root }}/zig"
        dest: /usr/local/bin/zig
        state: link
        force: yes

# .NET SDK for C# and F#, from the Ubuntu archive.
# The project files' TargetFramework must match this version.
- name: Install .NET SDK
  hosts: all
  vars_files:
    - vars.yml
  tags: dotnet

  become: yes
  tasks:

    - name: Install .NET SDK
      apt:
        name: "dotnet-sdk-{{ dotnet_version }}"
        state: present
        update_cache: yes

# Rust, installed with rustup for the user Ansible connects as, not root.
# The Rust project supports only the latest stable release, and the
# Ubuntu archive's rustc is several releases behind.
# rustup adds ~/.cargo/bin to the PATH in the user's shell startup files.
- name: Install Rust with rustup
  hosts: all
  vars_files:
    - vars.yml
  tags: rust

  become: no
  vars:
    rustup: "{{ ansible_facts.user_dir }}/.cargo/bin/rustup"
  tasks:

    - name: Install gcc, used by rustc as the linker
      apt:
        name: gcc
        state: present
      become: yes

    - name: Install rustup and the Rust toolchain
      shell: >-
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
        | sh -s -- -y --profile minimal --default-toolchain {{ rust_version }}
      args:
        executable: /bin/bash
        creates: "{{ rustup }}"

    - name: Install the Rust toolchain, if the version has changed
      command: "{{ rustup }} toolchain install {{ rust_version }} --profile minimal"
      args:
        creates: "{{ ansible_facts.user_dir }}/.rustup/toolchains/{{ rust_version }}-*"

    - name: Get the default Rust toolchain
      command: "{{ rustup }} default"
      register: rust_default
      changed_when: false

    - name: Make the configured version the default Rust toolchain
      command: "{{ rustup }} default {{ rust_version }}"
      when: not rust_default.stdout.startswith(rust_version ~ '-')

# JVM tools (Java, Groovy, Kotlin, Leiningen for Clojure, Scala), installed
# with SDKMAN for the user Ansible connects as, not root.
# Versions are set in vars.yml.
- name: Install JVM tools with SDKMAN
  hosts: all
  vars_files:
    - vars.yml
  tags: jvm

  become: no
  vars:
    sdkman_dir: "{{ ansible_facts.user_dir }}/.sdkman"
  environment:
    SDKMAN_DIR: "{{ sdkman_dir }}"
  tasks:

    - name: Install SDKMAN
      shell: curl -s "https://get.sdkman.io" | bash
      args:
        executable: /bin/bash
        creates: "{{ sdkman_dir }}/bin/sdkman-init.sh"

    - name: Install SDKMAN candidates
      shell: |
        source "{{ sdkman_dir }}/bin/sdkman-init.sh"
        sdk install {{ item.key }} {{ item.value }} </dev/null
      args:
        executable: /bin/bash
        creates: "{{ sdkman_dir }}/candidates/{{ item.key }}/{{ item.value }}"
      loop: "{{ sdkman_candidates | dict2items }}"

    - name: Make the configured versions the SDKMAN defaults
      file:
        src: "{{ sdkman_dir }}/candidates/{{ item.key }}/{{ item.value }}"
        dest: "{{ sdkman_dir }}/candidates/{{ item.key }}/current"
        state: link
        force: yes
      loop: "{{ sdkman_candidates | dict2items }}"
