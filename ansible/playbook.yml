---
# System-wide packages, installed as root.
- name: Install system packages
  hosts: all
  vars_files:
    - vars.yml

  become: yes
  tasks:

    - name: Install aptitude
      apt:
        name: aptitude
        state: present
        force_apt_get: yes
        update_cache: yes

    - name: Install language/locale support
      apt:
        name: language-pack-en
        state: present

    - name: Install curl, zip and unzip (also needed by SDKMAN)
      apt:
        name:
          - curl
          - zip
          - unzip
        state: present

    # - name: Install Common Lisp
    #   apt:
    #     name: sbcl
    #     state: present

    # - name: Install buildapp for Common Lisp
    #   apt:
    #     name: buildapp
    #     state: present

    - name: Add key for Crystal
      apt_key:
        url: https://keybase.io/crystal/pgp_keys.asc
        state: present

    - name: Define repo for Crystal
      apt_repository:
        repo: deb https://dist.crystal-lang.org/apt crystal main
        state: present

    - name: Install Crystal
      apt:
        name: crystal
        state: present

    - name: Add key for Dart
      apt_key:
        url: https://dl-ssl.google.com/linux/linux_signing_key.pub
        state: present

    - name: Define repo for Dart
      apt_repository:
        repo: deb https://storage.googleapis.com/download.dartlang.org/linux/debian stable main
        state: present

    - name: Install Dart
      apt:
        name: dart
        state: present
        update_cache: yes

    - name: Add key for Microsoft
      apt_key:
        url: https://packages.microsoft.com/keys/microsoft.asc
        state: present

    - name: Define repo for Microsoft .NET Core
      apt_repository:
        repo: deb https://packages.microsoft.com/ubuntu/18.04/prod bionic main
        state: present

    - name: Install .NET Core
      apt:
        name: dotnet-sdk-2.2
        state: present
        update_cache: yes

    - name: Define repo for Elixir
      apt:
        deb: https://packages.erlang-solutions.com/erlang-solutions_1.0_all.deb
        state: present

    - name: Install Erlang/OTP platform for Elixir
      apt:
        name: esl-erlang
        state: present
        update_cache: yes

    - name: Install Elixir
      apt:
        name: elixir
        state: present
        update_cache: yes

    - name: Install Go
      apt:
        name: golang-go
        state: present

    - name: Install Haskell
      apt:
        name: haskell-platform
        state: present

    - name: Install nodejs for JavaScript
      apt:
        name: nodejs
        state: present

    - name: Check if Julia has been downloaded locally
      stat:
        path: "{{ local_files_directory }}/{{ julia.archive }}"
      delegate_to: localhost
      become: no
      register: local_julia_archive
      when: local_download == True

    - name: Download Julia archive locally
      get_url:
        url: "{{ julia.base_url }}/{{ julia.archive }}"
        dest: "{{ local_files_directory }}/{{ julia.archive }}"
        timeout: 60
      delegate_to: localhost
      become: no
      when: local_download == True and local_julia_archive.stat.exists == False

    - name: Copy Julia archive to remote machine
      copy:
        src: "{{ local_files_directory }}/{{ julia.archive }}"
        dest: "/tmp/{{ julia.archive }}"
      when: local_download == True

    - name: Download Julia archive remotely
      get_url:
        url: "{{ julia.base_url }}/{{ julia.archive }}"
        dest: "/tmp/{{ julia.archive }}"
        timeout: 60
      when: local_download == False

    - name: Unpack Julia archive
      unarchive:
        remote_src: yes
        src: "/tmp/{{ julia.archive }}"
        dest: /opt/
        creates: "{{ julia.root }}"

    - name: Set PATH for Julia
      copy:
        dest: /etc/profile.d/julia-path.sh
        content: 'PATH=$PATH:{{ julia.root }}/bin'

    - name: Install Nim
      apt:
        name: nim
        state: present

    - name: Install Ruby
      apt:
        name: ruby
        state: present

    - name: Install Rust
      apt:
        name: rustc
        state: present

    - name: Install clang dependency for Swift
      apt:
        name: clang
        state: present

    - name: Install libicu-dev dependency for Swift
      apt:
        name: libicu-dev
        state: present

    - name: Check if Swift has been downloaded locally
      stat:
        path: "{{ local_files_directory }}/{{ swift.archive }}"
      delegate_to: localhost
      become: no
      register: local_swift_archive
      when: local_download == True

    - name: Download Swift archive locally
      get_url:
        url: "{{ swift.base_url }}/{{ swift.archive }}"
        dest: "{{ local_files_directory }}/{{ swift.archive }}"
        timeout: 60
      delegate_to: localhost
      become: no
      when: local_download == True and local_swift_archive.stat.exists == False

    - name: Copy Swift archive to remote machine
      copy:
        src: "{{ local_files_directory }}/{{ swift.archive }}"
        dest: "/tmp/{{ swift.archive }}"
      when: local_download == True

    - name: Download Swift archive remotely
      get_url:
        url: "{{ swift.base_url }}/{{ swift.archive }}"
        dest: "/tmp/{{ swift.archive }}"
        timeout: 60
      when: local_download == False

    - name: Unpack Swift archive
      unarchive:
        remote_src: yes
        src: "/tmp/{{ swift.archive }}"
        dest: /opt/
        creates: "{{ swift.root }}"

    - name: Set PATH for Swift
      copy:
        dest: /etc/profile.d/swift-path.sh
        content: 'PATH=$PATH:{{ swift.root }}/usr/bin'

# JVM tools (Java, Groovy, Kotlin, Leiningen for Clojure, Scala), installed
# with SDKMAN for the user Ansible connects as, not root.
# Versions are set in vars.yml.
- name: Install JVM tools with SDKMAN
  hosts: all
  vars_files:
    - vars.yml
  tags: jvm

  become: no
  vars:
    sdkman_dir: "{{ ansible_facts.user_dir }}/.sdkman"
  environment:
    SDKMAN_DIR: "{{ sdkman_dir }}"
  tasks:

    - name: Install SDKMAN
      shell: curl -s "https://get.sdkman.io" | bash
      args:
        executable: /bin/bash
        creates: "{{ sdkman_dir }}/bin/sdkman-init.sh"

    - name: Install SDKMAN candidates
      shell: |
        source "{{ sdkman_dir }}/bin/sdkman-init.sh"
        sdk install {{ item.key }} {{ item.value }} </dev/null
      args:
        executable: /bin/bash
        creates: "{{ sdkman_dir }}/candidates/{{ item.key }}/{{ item.value }}"
      loop: "{{ sdkman_candidates | dict2items }}"

    - name: Make the configured versions the SDKMAN defaults
      file:
        src: "{{ sdkman_dir }}/candidates/{{ item.key }}/{{ item.value }}"
        dest: "{{ sdkman_dir }}/candidates/{{ item.key }}/current"
        state: link
        force: yes
      loop: "{{ sdkman_candidates | dict2items }}"
