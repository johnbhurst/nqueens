# Node.js major version, from the NodeSource repository. Use an LTS version:
# see https://nodejs.org/en/about/previous-releases.
nodejs_major_version: "26"

# .NET SDK installed from the Ubuntu archive (package dotnet-sdk-<version>).
dotnet_version: "10.0"

# Rust toolchain installed with rustup. See https://releases.rs/.
rust_version: "1.100.0"

# JVM tools installed with SDKMAN: candidate name -> version.
# See available versions with: sdk list <candidate>
sdkman_candidates:
  java: "25.0.5.0+8-tem"
  groovy: "5.1.3"
  kotlin: "2.4.21"
  leiningen: "2.12.0"
  scala: "3.10.0"
