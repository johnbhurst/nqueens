local_files_directory: local_files
local_download: True

# Julia binary archive. Versions and checksums are listed in
# https://julialang-s3.julialang.org/bin/versions.json.
julia:
  base_url: "https://julialang-s3.julialang.org/bin/linux/x64/1.13"
  archive: "julia-1.13.3-linux-x86_64.tar.gz"
  sha256: "5c61cb4b40332cb5a3504e7779e2f5dac093caa4a1116ded19f01413f85c63e4"
  root: "/opt/julia-1.13.3"

swift:
  base_url: "https://swift.org/builds/swift-5.2.1-release/ubuntu1804/swift-5.2.1-RELEASE"
  archive: "swift-5.2.1-RELEASE-ubuntu18.04.tar.gz"
  root: "/opt/swift-5.2.1-RELEASE-ubuntu18.04"

# Node.js major version, from the NodeSource repository. Use an LTS version:
# see https://nodejs.org/en/about/previous-releases.
nodejs_major_version: "26"

# .NET SDK installed from the Ubuntu archive (package dotnet-sdk-<version>).
dotnet_version: "10.0"

# Rust toolchain installed with rustup. See https://releases.rs/.
rust_version: "1.100.0"

# JVM tools installed with SDKMAN: candidate name -> version.
# See available versions with: sdk list <candidate>
sdkman_candidates:
  java: "25.0.5.0+8-tem"
  groovy: "5.1.3"
  kotlin: "2.4.21"
  leiningen: "2.12.0"
  scala: "3.10.0"
